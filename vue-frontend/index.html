<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Programming Question Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .gpt-bg {
            background: #0a0a0a;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 163, 127, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.08), transparent),
                radial-gradient(ellipse 50% 30% at 0% 100%, rgba(139, 92, 246, 0.06), transparent);
        }
        .gpt-logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(145deg, #19c37d 0%, #10a37f 50%, #0d8f6e 100%);
            box-shadow: 0 8px 32px rgba(16, 163, 127, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8e8ea0;
            animation: bounce 1.4s ease-in-out infinite both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; background: #ececf1; }
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            background-size: 200% 100%;
            animation: shimmer 2.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .btn-gpt {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #ececf1;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }
        .btn-gpt:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="gpt-bg min-h-screen flex flex-col items-center justify-center text-white antialiased overflow-hidden">
    <div class="absolute inset-0 shimmer pointer-events-none"></div>

    <div class="relative z-10 flex flex-col items-center px-6 max-w-lg text-center">
        <div class="gpt-logo flex items-center justify-center mb-8">
            <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
            </svg>
        </div>

        <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-[#ececf1] mb-2">
            AI Programming Question Bank
        </h1>
        <p class="text-sm sm:text-base text-[#8e8ea0] mb-10 max-w-md leading-relaxed">
            Intelligent teaching assistance and programming practice. Preparing your workspace…
        </p>

        <div class="flex items-center justify-center gap-1.5 mb-10" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 w-full max-w-sm">
            <a href="signup.html"
               class="btn-gpt inline-flex items-center justify-center gap-2 px-8 py-3 rounded-xl text-[15px] font-medium w-full sm:w-auto min-w-[10rem]">
                Sign up
                <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
            </a>
            <a href="login.html"
               class="btn-gpt inline-flex items-center justify-center gap-2 px-8 py-3 rounded-xl text-[15px] font-medium w-full sm:w-auto min-w-[10rem]">
                Log in
                <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
            </a>
        </div>
    </div>

    <footer class="absolute bottom-6 left-0 right-0 text-center text-[11px] text-[#5c5c66]">
        © 2025 AI Programming Question Bank
    </footer>
</body>
</html>
