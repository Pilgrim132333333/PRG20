<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — AI Programming Question Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .gpt-bg {
            background: #0a0a0a;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 163, 127, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.08), transparent),
                radial-gradient(ellipse 50% 30% at 0% 100%, rgba(139, 92, 246, 0.06), transparent);
        }
        .gpt-logo {
            width: 56px; height: 56px; border-radius: 14px;
            background: linear-gradient(145deg, #19c37d 0%, #10a37f 50%, #0d8f6e 100%);
            box-shadow: 0 8px 32px rgba(16, 163, 127, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            background-size: 200% 100%;
            animation: shimmer 2.5s ease-in-out infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .input-gpt {
            background: rgba(47, 47, 47, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ececf1;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-gpt::placeholder { color: #6e6e80; }
        .input-gpt:focus {
            outline: none;
            border-color: rgba(16, 163, 127, 0.5);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.15);
        }
        .card-gpt {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }
        .btn-submit {
            background: linear-gradient(145deg, #19c37d 0%, #10a37f 100%);
            color: #fff;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body class="gpt-bg min-h-screen flex flex-col items-center justify-center text-white antialiased p-4">
    <div class="absolute inset-0 shimmer pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md">
        <div class="flex flex-col items-center mb-8">
            <div class="gpt-logo flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-semibold tracking-tight text-[#ececf1] text-center">AI Programming Question Bank</h1>
            <p class="text-sm text-[#8e8ea0] mt-2 text-center">Log in to continue</p>
        </div>

        <div class="card-gpt rounded-2xl p-6 sm:p-8 shadow-2xl">
            <p id="formError" class="hidden mb-4 text-sm text-red-400 bg-red-950/40 border border-red-800/50 rounded-lg px-3 py-2"></p>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-[#8e8ea0] mb-1.5">User name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#6e6e80]"><i class="fa fa-user"></i></span>
                        <input type="text" id="username" name="username" maxlength="50" class="input-gpt w-full pl-10 pr-3 py-2.5 rounded-lg text-[15px]"
                               placeholder="Your username" required autocomplete="username">
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-[#8e8ea0] mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#6e6e80]"><i class="fa fa-lock"></i></span>
                        <input type="password" id="password" name="password" maxlength="255" class="input-gpt w-full pl-10 pr-3 py-2.5 rounded-lg text-[15px]"
                               placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit w-full font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 text-[15px] mt-2">
                    <span>Log in</span>
                    <i class="fa fa-arrow-right text-sm opacity-90"></i>
                </button>
            </form>
        </div>

        <p class="mt-6 text-center text-sm text-[#8e8ea0]">
            No account?
            <a href="signup.html" class="text-[#10a37f] hover:underline">Sign up</a>
        </p>
        <p class="mt-4 text-center">
            <a href="index.html" class="text-sm text-[#8e8ea0] hover:text-[#ececf1] transition-colors">← Back to home</a>
        </p>
    </div>

    <footer class="absolute bottom-6 left-0 right-0 text-center text-[11px] text-[#5c5c66]">© 2025 AI Programming Question Bank</footer>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';

        function showError(msg) {
            const el = document.getElementById('formError');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() {
            document.getElementById('formError').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            try {
                const res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const d = data.detail;
                    const msg = typeof d === 'string' ? d : (Array.isArray(d) ? ((d[0] && d[0].msg) || 'Validation error') : (res.statusText || 'Login failed'));
                    showError(msg);
                    return;
                }
                localStorage.setItem('currentUser', JSON.stringify({
                    userId: data.user_id,
                    username: data.username,
                    email: data.email,
                    role: data.role || 'student'
                }));
                window.location.href = 'student.html';
            } catch (err) {
                console.error(err);
                showError('Cannot reach the server. Is the backend running?');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
